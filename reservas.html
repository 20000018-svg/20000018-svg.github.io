<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservaciones - La Pampa & Carbón</title>
  <link rel="stylesheet" href="miestilo.css">
</head>
<body>

  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">La Pampa & Carbón</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Inicio</a></li>
          <li><a href="menu.html" class="nav-link">Menú</a></li>
          <li><a href="reservas.html" class="nav-link active">Reservas</a></li>
          <li><a href="contacto.html" class="nav-link">Contacto</a></li>
          <li><a href="login.html" class="nav-link">Iniciar Sesion</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="form-container">
      <h2>Reserva tu Mesa</h2>
      
      <!-- Formulario configurado para redirigir a confirmacion.html -->
      <form id="reserva-form" action="confirmacion.html" method="GET">
        <div class="form-group">
          <label for="personas">Número de Personas:</label>
          <input type="number" id="personas" name="personas" class="form-control" min="1" max="20" required>
        </div>

        <div class="form-group">
          <label for="fecha">Fecha:</label>
          <input type="date" id="fecha" name="fecha" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="hora">Hora:</label>
          <input type="time" id="hora" name="hora" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="zona">Zona del Restaurante:</label>
          <select id="zona" name="zona" class="form-select form-control" required>
            <option value="">Selecciona una zona...</option>
            <option value="Terraza al aire libre">Terraza al aire libre</option>
            <option value="Comedor Principal">Comedor Principal</option>
            <option value="Zona VIP">Zona VIP</option>
          </select>
        </div>

        <button type="submit" class="btn-primary btn-full">Confirmar Reserva</button>
      </form>

    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Restaurante La Pampa & Carbón. Todos los derechos reservados.</p>
    </div>
  </footer>

</body>
</html>
