<body>

  <header class="header">

      <a href="index.html" class="logo">La Pampa & Carbón</a>
     <nav>

    </div>
  </header>

  <main class="container">
    <section class="form-container">
      <h2>Iniciar Sesión</h2>
      <form action="index.html" method="get">
        <div class="form-group">
          <label for="login-email">Correo Electrónico:</label>
          <input type="email" id="login-email" name="email" class="form-control" placeholder="usuario@correo.com" required>
        </div>
        
        <div class="form-group">
          <label for="login-password">Contraseña:</label>
          <input type="password" id="login-password" name="password" class="form-control" minlength="6" required>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Iniciar Sesión</button>
      </form>
    </section>
  </main>
