<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - La Pampa & Carbón</title>
  <link rel="stylesheet" href="miestilo.css">
</head>
<body>

  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">La Pampa & Carbón</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Inicio</a></li>
          <li><a href="menu.html" class="nav-link">Menú</a></li>
          <li><a href="reservas.html" class="nav-link">Reservas</a></li>
          <li><a href="contacto.html" class="nav-link active">Contacto</a></li>
          <li><a href="login.html" class="nav-link">Iniciar Sesion</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="form-container">
      <h2>Contáctanos</h2>
      <form action="#" method="get">
        <div class="form-group">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" class="form-control" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
          <label for="asunto">Asunto:</label>
          <input type="text" id="asunto" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" rows="5" class="form-control" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%;">Enviar Mensaje</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Restaurante Sabor & Arte. Todos los derechos reservados.</p>
    </div>
  </footer>

</body>
</html>
